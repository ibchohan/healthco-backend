spring:
  config:
    activate:
      on-profile: local
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/appointment-system}
    username: ${DB_USER:USER}
    password: ${DB_PASSWORD:TEST}
  flyway:
    enabled: true
    user: ${DB_USER:USER}
    password: ${DB_PASSWORD:TEST}
    url: ${DB_URL:jdbc:postgresql://localhost:5432/appointment-system}
    locations: classpath:db/migration

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false

server:
  compression:
    enabled: true
  forward-headers-strategy: NATIVE
  http2:
    enabled: true
  port: 8080
  shutdown: graceful

springdoc:
  api-docs:
    enabled: true

security:
  jwt:
    access-token-secret-key: 3cfa76ef14937c1c0ea519f8fc057a80fcd04a7420f8e8bcd0a7567c272e007b3cfa76ef14937c1c0ea519f8fc057a80fcd04a74
    access-token-expiration-time: 360000000000000000 # 1h in millisecond
    refresh-token-secret-key: 3cfa76ef14937c1c0ea519f8fc057a80fcd04a7420f8e8bcd0a7567c272e007b3cfa76ef14937c1c0ea519f8fc057a80fcd04a74
    refresh-token-expiration-time: 21600000 # 6h in millisecond

  # Local development security user (override with env vars if desired)
  security:
    user:
      name: ${DEV_SECURITY_USER:dev}
      password: ${DEV_SECURITY_PASSWORD:devpassword}

logging:
  level:
    org.flywaydb: INFO

